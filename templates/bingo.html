<!DOCTYPE html>
<html>
<head>
    <title>Bingo Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 BINGO GAME</h1>
        <div class="info">
            <p>Player ID: {{ user_id }}</p>
            <p>Game ID: {{ game_id }}</p>
            <p>Balance: {{ initial_balance }} ETB</p>
        </div>
        <button class="btn" onclick="alert('Game starting soon!')">
            Play Bingo
        </button>
        <p style="margin-top: 20px; color: #666;">
            <a href="https://t.me/Treeeeestbot" style="color: #667eea;">Back to Bot</a>
        </p>
    </div>
</body>
</html>
