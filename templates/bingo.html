<!DOCTYPE html>
<html>
<head>
    <title>Bingo Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 42px;
            margin-bottom: 20px;
        }
        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }
        .label {
            color: #666;
        }
        .value {
            font-weight: bold;
            color: #333;
        }
        .balance {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
        }
        .game-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            transition: transform 0.2s;
        }
        .game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 BINGO</h1>
        
        <div class="info-box">
            <div class="info-item">
                <span class="label">Player ID:</span>
                <span class="value">{{ user_id }}</span>
            </div>
            <div class="info-item">
                <span class="label">Game ID:</span>
                <span class="value">{{ game_id }}</span>
            </div>
            <div class="info-item">
                <span class="label">Balance:</span>
                <span class="balance">{{ initial_balance }} ETB</span>
            </div>
        </div>
        
        <button class="game-btn" onclick="alert('Game is loading...')">
            🎮 Play Bingo
        </button>
        
        <p style="color: #666; margin: 15px 0;">
            Price: {{ price_per_card }} ETB per card | Max: {{ max_cards }} cards
        </p>
        
        <a href="https://t.me/Treeeeestbot" class="back-link">← Back to Bot</a>
    </div>

    <script>
        // Auto-expand for Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
